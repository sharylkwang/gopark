name: CI/CD
on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, nas]
    env:
      GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
      DATAGOVSG_KEY: ${{ secrets.DATAGOVSG_KEY }}
      DATAMALL_API: ${{ secrets.DATAMALL_API }}
      GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
      ZHIPUAI_MODEL: ${{ secrets.ZHIPUAI_MODEL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: cd backend && npm install --no-bin-links

      - name: Install frontend dependencies
        run: cd frontend && npm install --no-bin-links

      - name: Run backend unit tests
        run: cd backend && npm run test:unit

      - name: Run frontend unit tests
        run: cd frontend && npm test

      - name: Verify API keys
        run: cd backend && npm run test:integration

  deploy:
    needs: test
    runs-on: [self-hosted, nas]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Write .env
        env:
          DATAGOVSG_KEY: ${{ secrets.DATAGOVSG_KEY }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          DATAMALL_API: ${{ secrets.DATAMALL_API }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ZHIPUAI_MODEL: ${{ secrets.ZHIPUAI_MODEL }}
          VLLM_URL: ${{ secrets.VLLM_URL }}
          VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_EMAIL_PASSWORD: ${{ secrets.ONEMAP_EMAIL_PASSWORD }}
        run: |
          env | grep -E '^(DATAGOVSG_KEY|GEOAPIFY_KEY|GOOGLE_MAPS_KEY|DATAMALL_API|DATABASE_URL|ZHIPUAI_API_KEY|CLOUDFLARE_TUNNEL_TOKEN|HF_TOKEN|ZHIPUAI_MODEL|VLLM_URL|VLLM_MODEL|LOG_LEVEL|VITE_TURNSTILE_SITE_KEY|JWT_SECRET|EMAIL_USER|EMAIL_APP_PASSWORD|TURNSTILE_SECRET_KEY|ONEMAP_EMAIL|ONEMAP_EMAIL_PASSWORD)=' > .env
      - name: Deploy
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans || true
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
