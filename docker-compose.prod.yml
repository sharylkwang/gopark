name: gopark-prod

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: gopark-nginx
    expose:
      - "80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: gopark-backend
    command: sh -c "for m in 1_init 2_seedstatus 3_timestamps 4_sources 5_scraper 6_postgis; do npx prisma migrate resolve --applied $$m 2>/dev/null; done && npx prisma migrate deploy && npm start"
    env_file:
      - path: ./.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password123@gopark:5432/gopark
    depends_on:
      gopark:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gopark-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

  gopark:
    image: postgis/postgis:15-3.4-alpine
    container_name: gopark
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=gopark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gopark"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: