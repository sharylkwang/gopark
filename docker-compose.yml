services:
  nginx:
    image: nginx:alpine
    container_name: gopark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    container_name: gopark-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: sh -c "rm -rf node_modules/.bin && npm install && npx prisma generate && npx prisma migrate resolve --applied 7_auth 2>/dev/null; npx prisma migrate deploy && npm run dev"
    env_file:
      - path: ./.env
        required: false
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password123@gopark:5432/gopark
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED:-false}
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - /app/node_modules
    depends_on:
      gopark:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gopark-frontend
    restart: unless-stopped
    environment:
      - VITE_CAPTCHA_ENABLED=${VITE_CAPTCHA_ENABLED:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    depends_on:
      - backend

  gopark:
    image: postgis/postgis:15-3.4-alpine
    container_name: gopark
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=gopark
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gopark"]
      interval: 5s
      timeout: 5s
      retries: 5

  vllm:
    image: vllm/vllm-openai:latest
    container_name: gopark-vllm
    restart: unless-stopped
    profiles:
      - gpu
    ipc: host
    shm_size: "16g"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - model-cache:/root/.cache/huggingface
    ports:
      - "8100:8000"
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3.5-4B}
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
      --gpu-memory-utilization 0.85
      --max-num-seqs 16
      --dtype auto
      --trust-remote-code
      --enforce-eager
      --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  pgdata:
  model-cache:
