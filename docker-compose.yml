services:
  nginx:
    image: nginx:alpine
    container_name: gopark-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    container_name: gopark-backend
    command: npm run dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password123@gopark:5432/gopark
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      gopark:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gopark-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  gopark:
    image: postgres:15-alpine
    container_name: gopark
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=gopark
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gopark"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
